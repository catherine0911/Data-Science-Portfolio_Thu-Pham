<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sales by Category</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>body{margin:0;font-family:sans-serif;background:#f8f9fa}.chart-container{max-width:1100px;margin:32px auto;padding:0 24px}</style>
</head>
<body>
<div class="chart-container">
<div id="chart-cat"></div>
<div id="chart-subcat" style="margin-top:32px"></div>
</div>
<script>
// Category-level data (real Superstore numbers)
var categories = ["Office Supplies", "Furniture", "Technology"];
var catSales   = [705422.33, 728658.58, 827455.87];
var catColors  = ["#748FCA", "#4361EE", "#3A0CA3"];

var traceCat = {
  x: catSales, y: categories,
  type: "bar", orientation: "h",
  marker: {color: catColors},
  text: catSales.map(v => "$" + (v/1000).toFixed(0) + "K"),
  textposition: "outside",
  hovertemplate: "<b>%{y}</b><br>Total Sales: $%{x:,.0f}<extra></extra>"
};

var layoutCat = {
  title: {text: "Total Sales by Category (2015–2018)", font: {size: 17}},
  xaxis: {title: "Total Sales ($)", tickformat: "$,.0f", range: [0, 980000]},
  yaxis: {title: ""},
  template: "plotly_white",
  height: 280,
  margin: {l: 130, r: 100, t: 60, b: 60}
};

// Sub-category data (top 10 by sales)
var subCats = [
  "Tables","Bookcases","Chairs","Storage","Art",
  "Binders","Labels","Paper","Phones","Machines"
];
var subSales = [
  206966, 114880, 328449, 223844, 27119,
  203413, 12486, 78479, 330007, 189239
];
var subColors = subCats.map(s => {
  if (["Tables","Bookcases","Chairs"].includes(s)) return "#4361EE";
  if (["Storage","Art","Binders","Labels","Paper"].includes(s)) return "#748FCA";
  return "#3A0CA3";
});

var traceSub = {
  x: subSales,
  y: subCats,
  type: "bar", orientation: "h",
  marker: {color: subColors},
  text: subSales.map(v => "$" + (v/1000).toFixed(0) + "K"),
  textposition: "outside",
  hovertemplate: "<b>%{y}</b><br>Sales: $%{x:,.0f}<extra></extra>"
};

var layoutSub = {
  title: {text: "Sales by Sub-Category (top 10)", font: {size: 17}},
  xaxis: {title: "Total Sales ($)", tickformat: "$,.0f", range: [0, 400000]},
  yaxis: {title: "", autorange: "reversed"},
  template: "plotly_white",
  height: 400,
  margin: {l: 130, r: 80, t: 60, b: 60},
  annotations: [
    {x: 328449, y: "Chairs",   text: "Furniture", showarrow: false, xshift: 48, font: {size: 10, color: "#4361EE"}},
    {x: 330007, y: "Phones",   text: "Technology", showarrow: false, xshift: 52, font: {size: 10, color: "#3A0CA3"}},
    {x: 203413, y: "Binders",  text: "Office Supplies", showarrow: false, xshift: 68, font: {size: 10, color: "#748FCA"}}
  ]
};

Plotly.newPlot("chart-cat",    [traceCat], layoutCat,    {responsive: true});
Plotly.newPlot("chart-subcat", [traceSub], layoutSub,    {responsive: true});
</script>
</body>
</html>
