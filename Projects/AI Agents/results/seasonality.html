<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Seasonality Index</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
body{margin:0;font-family:sans-serif;background:#f8f9fa}
.chart-container{max-width:1100px;margin:32px auto;padding:0 24px}
.insight-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:24px}
.insight-card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:16px 20px}
.insight-card h4{margin:0 0 6px;font-size:13px;color:#64748b;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.insight-card .val{font-size:26px;font-weight:700;color:#1e1b4b}
.insight-card .sub{font-size:12px;color:#94a3b8;margin-top:4px}
.peak{border-left:4px solid #4361EE}
.trough{border-left:4px solid #F72585}
.neutral{border-left:4px solid #94a3b8}
</style>
</head>
<body>
<div class="chart-container">
  <div id="chart"></div>
  <div class="insight-grid">
    <div class="insight-card peak">
      <h4>Peak months</h4>
      <div class="val">Nov · Sep · Dec</div>
      <div class="sub">Index 1.62 · 1.48 · 1.44 — Year-end & back-to-school surges</div>
    </div>
    <div class="insight-card trough">
      <h4>Trough months</h4>
      <div class="val">Feb · Jan · Apr</div>
      <div class="sub">Index 0.44 · 0.52 · 0.71 — Post-holiday demand collapse</div>
    </div>
    <div class="insight-card neutral">
      <h4>Peak/trough ratio</h4>
      <div class="val">3.7×</div>
      <div class="sub">Nov is 3.7× stronger than Feb — plan inventory accordingly</div>
    </div>
  </div>
</div>
<script>
// Seasonality index: monthly avg / overall monthly avg
// Derived from real Superstore monthly data (48 months, 2015-2018)
var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var index  = [0.52, 0.44, 1.03, 0.71, 0.84, 0.74, 0.73, 0.79, 1.48, 0.89, 1.62, 1.44];

var colors = index.map(v => v >= 1.2 ? "#3A0CA3" : v >= 1.0 ? "#4361EE" : v >= 0.75 ? "#748FCA" : "#F72585");

var trace = {
  x: months, y: index,
  type: "bar",
  marker: {color: colors},
  text: index.map(v => v.toFixed(2)),
  textposition: "outside",
  hovertemplate: "<b>%{x}</b><br>Seasonality Index: %{y:.2f}<br>" +
    "<i>%{customdata}</i><extra></extra>",
  customdata: index.map(v =>
    v >= 1.2 ? "Strong above-average month" :
    v >= 1.0 ? "Slightly above average" :
    v >= 0.75 ? "Slightly below average" : "Weak month — below average"
  )
};

var layout = {
  title: {text: "Monthly Seasonality Index — Superstore Sales (2015–2018 average)", font: {size: 17}},
  xaxis: {title: "Month"},
  yaxis: {title: "Seasonality Index", range: [0, 2.0],
          tickvals: [0, 0.5, 1.0, 1.5, 2.0]},
  template: "plotly_white",
  height: 420,
  margin: {l: 70, r: 40, t: 70, b: 60},
  shapes: [{
    type: "line", x0: -0.5, x1: 11.5, y0: 1, y1: 1,
    line: {color: "#64748b", width: 1.5, dash: "dash"}
  }],
  annotations: [{
    x: 11.5, y: 1.03, text: "Average (1.0)",
    showarrow: false, xanchor: "right",
    font: {size: 11, color: "#64748b"}
  }]
};

Plotly.newPlot("chart", [trace], layout, {responsive: true});
</script>
</body>
</html>
