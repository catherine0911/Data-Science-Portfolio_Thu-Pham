<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Monthly Sales Trend</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>body{margin:0;font-family:sans-serif;background:#f8f9fa}.chart-container{max-width:1100px;margin:32px auto;padding:0 24px}</style>
</head>
<body>
<div class="chart-container">
<div id="chart"></div>
</div>
<script>
var months = [
  "2015-01","2015-02","2015-03","2015-04","2015-05","2015-06",
  "2015-07","2015-08","2015-09","2015-10","2015-11","2015-12",
  "2016-01","2016-02","2016-03","2016-04","2016-05","2016-06",
  "2016-07","2016-08","2016-09","2016-10","2016-11","2016-12",
  "2017-01","2017-02","2017-03","2017-04","2017-05","2017-06",
  "2017-07","2017-08","2017-09","2017-10","2017-11","2017-12",
  "2018-01","2018-02","2018-03","2018-04","2018-05","2018-06",
  "2018-07","2018-08","2018-09","2018-10","2018-11","2018-12"
];
var sales = [
  14205.71, 4519.89, 55205.80, 27906.86, 23644.30, 34322.94,
  33781.54, 27117.54, 81623.53, 31453.39, 77907.66, 68167.06,
  18066.96, 11951.41, 32339.32, 34154.47, 29959.53, 23599.37,
  28608.26, 36818.34, 63133.61, 31011.74, 75249.40, 74543.60,
  18542.49, 22978.82, 51165.06, 38679.77, 56656.91, 39724.49,
  38320.78, 30542.20, 69193.39, 59583.03, 79066.50, 95739.12,
  43476.47, 19920.00, 58863.41, 35541.91, 43825.98, 48190.73,
  44825.10, 62837.85, 86152.89, 77448.13, 117938.16, 83030.39
];

// Annotate peak month
var annotations = [{
  x: "2018-11",
  y: 117938.16,
  xref: "x", yref: "y",
  text: "Peak: $117,938",
  showarrow: true,
  arrowhead: 2,
  ax: 0, ay: -40,
  font: {size: 12, color: "#4361EE"},
  bgcolor: "#eef1ff",
  bordercolor: "#4361EE",
  borderwidth: 1,
  borderpad: 4
}];

var trace = {
  x: months,
  y: sales,
  type: "scatter",
  mode: "lines+markers",
  name: "Monthly Sales",
  line: {color: "#4361EE", width: 2.5},
  marker: {size: 5, color: "#4361EE"},
  fill: "tozeroy",
  fillcolor: "rgba(67,97,238,0.07)",
  hovertemplate: "<b>%{x}</b><br>Sales: $%{y:,.0f}<extra></extra>"
};

var layout = {
  title: {text: "Monthly Sales Trend — Superstore 2015–2018", font: {size: 18}},
  xaxis: {title: "Month", tickangle: -45, dtick: 3},
  yaxis: {title: "Sales ($)", tickformat: "$,.0f"},
  annotations: annotations,
  template: "plotly_white",
  height: 450,
  margin: {l: 80, r: 40, t: 70, b: 90},
  hovermode: "x unified"
};

Plotly.newPlot("chart", [trace], layout, {responsive: true});
</script>
</body>
</html>
