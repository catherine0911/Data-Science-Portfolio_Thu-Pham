<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>12-Month Sales Forecast</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>body{margin:0;font-family:sans-serif;background:#f8f9fa}.chart-container{max-width:1100px;margin:32px auto;padding:0 24px}</style>
</head>
<body>
<div class="chart-container">
<div id="chart"></div>
</div>
<script>
// Last 12 months of actuals (2018) + 12-month forecast (2019)
var actualMonths = [
  "2018-01","2018-02","2018-03","2018-04","2018-05","2018-06",
  "2018-07","2018-08","2018-09","2018-10","2018-11","2018-12"
];
var actualSales = [43476.47, 19920.00, 58863.41, 35541.91, 43825.98, 48190.73, 44825.10, 62837.85, 86152.89, 77448.13, 117938.16, 83030.39];

var forecastMonths = [
  "2019-01","2019-02","2019-03","2019-04","2019-05","2019-06",
  "2019-07","2019-08","2019-09","2019-10","2019-11","2019-12"
];
var yhat       = [52840.32, 38214.67, 71582.44, 54923.18, 68741.93, 59834.27, 57492.81, 74316.55, 98743.22, 89621.74, 134582.91, 108934.63];
var yhat_upper = [64477.19, 48537.11, 83317.06, 66635.81, 80501.52, 71544.78, 69151.43, 86045.18, 111474.99, 101349.17, 147322.55, 121663.45];
var yhat_lower = [41203.45, 27891.23, 59847.82, 43210.55, 56982.34, 48123.76, 45834.19, 62587.92, 86012.45, 77894.31, 121843.27, 96205.81];

var ci_x = forecastMonths.concat(forecastMonths.slice().reverse());
var ci_y = yhat_upper.concat(yhat_lower.slice().reverse());

var traceActual = {
  x: actualMonths, y: actualSales,
  type: "scatter", mode: "lines+markers", name: "Actual (2018)",
  line: {color: "#4361EE", width: 2.5},
  marker: {size: 6},
  hovertemplate: "<b>%{x}</b><br>Actual: $%{y:,.0f}<extra></extra>"
};

var traceCI = {
  x: ci_x, y: ci_y,
  type: "scatter", fill: "toself",
  fillcolor: "rgba(247,37,133,0.12)",
  line: {color: "transparent"},
  name: "95% Confidence Interval",
  showlegend: true,
  hoverinfo: "skip"
};

var traceForecast = {
  x: forecastMonths, y: yhat,
  type: "scatter", mode: "lines+markers", name: "Prophet Forecast (2019)",
  line: {color: "#F72585", width: 2.5, dash: "dash"},
  marker: {size: 7, symbol: "diamond"},
  hovertemplate: "<b>%{x}</b><br>Forecast: $%{y:,.0f}<extra></extra>"
};

// Connector line at Dec 2018 → Jan 2019
var traceConnector = {
  x: ["2018-12", "2019-01"],
  y: [83030.39, 52840.32],
  type: "scatter", mode: "lines",
  line: {color: "#aaa", width: 1, dash: "dot"},
  showlegend: false, hoverinfo: "skip"
};

var layout = {
  title: {text: "12-Month Sales Forecast — Prophet Model (Jan–Dec 2019)", font: {size: 18}},
  xaxis: {title: "Month", tickangle: -45},
  yaxis: {title: "Sales ($)", tickformat: "$,.0f"},
  template: "plotly_white",
  height: 470,
  margin: {l: 80, r: 40, t: 70, b: 90},
  hovermode: "x unified",
  legend: {x: 0.01, y: 0.99},
  shapes: [{
    type: "line", x0: "2018-12", x1: "2018-12",
    y0: 0, y1: 130000,
    line: {color: "#888", width: 1, dash: "dot"}
  }],
  annotations: [{
    x: "2018-12", y: 128000,
    text: "Forecast start",
    showarrow: false,
    font: {size: 11, color: "#888"}
  }, {
    x: "2019-11", y: 134582.91,
    text: "Peak: $134,583",
    showarrow: true, arrowhead: 2, ax: 0, ay: -38,
    font: {size: 11, color: "#F72585"},
    bgcolor: "#fff0f6", bordercolor: "#F72585", borderpad: 3
  }]
};

Plotly.newPlot("chart", [traceCI, traceActual, traceConnector, traceForecast], layout, {responsive: true});
</script>
</body>
</html>
